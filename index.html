<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESL Energy Rush</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <main class="app">
    <header class="topbar">
      <div>
        <p class="tag">Infinite ESL Sprint</p>
        <h1>Energy English ⚡</h1>
      </div>
      <button id="sound-toggle" class="sound-btn" type="button" aria-pressed="true">🔊</button>
    </header>

    <section class="stats" aria-live="polite">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Streak</span><strong id="streak">0</strong></div>
      <div class="stat"><span>Mode</span><strong id="mode">Emoji ➜ Word</strong></div>
    </section>

    <section class="energy-wrap" aria-label="Energy timer">
      <div class="energy-label">
        <span>Energy</span>
        <strong id="energy-value">100%</strong>
      </div>
      <div class="energy-track">
        <div id="energy-fill" class="energy-fill"></div>
      </div>
    </section>

    <section class="card" id="card">
      <p class="prompt" id="prompt"></p>
      <div class="question" id="question"></div>

      <button id="audio-btn" class="audio-btn hidden" type="button" aria-label="Play audio">
        <span class="speaker">🔊</span>
        <span class="pulse"></span>
      </button>

      <div id="options" class="options" role="group" aria-label="Choices"></div>
      <p id="feedback" class="feedback">Get ready!</p>
    </section>

    <section id="game-over" class="game-over hidden" aria-live="polite">
      <h2>Game Over</h2>
      <p id="final-score"></p>
      <p id="rating"></p>
      <button id="play-again" type="button">Play Again</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
